    This is part of a collection containing molecular dynamics simulations of 59 kinases
    both in their apo form and in complex with a total 220 ligands  (average of ~4
    ligands per kinase). All-atom simulations were performed using GROMACS v2024 with
    the CHARMM36 force field (July 2020 version), and ligand parameters were generated
    with SwissParam. The protein was solvated in a periodic dodecahedron box with
    TIP3P water and neutralized with Na+/Cl− ions at 150 mM. Protonation states were
    assigned at pH 7 based on pKa values from propKa. Systems were energy minimized
    using the steepest descent algorithm for 5000 steps, followed by equilibration
    consisting of 1 ns with heavy-atom restraints (1000 kJ/mol/nm2) and 10 ns without
    restraints. Production simulations were carried out in the NPT ensemble for 500
    ns in four replicates with different velocity seeds. A timestep of 2 fs was used,
    and coordinates were saved every 10 ps. Bonds involving hydrogens were constrained
    using LINCS. Electrostatics were treated with the Particle-Mesh Ewald method (grid
    spacing 0.12 nm, cubic interpolation), and van der Waals and electrostatic cutoffs
