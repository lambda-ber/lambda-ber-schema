  role: target
  copy_number: 1

experiment_sample_associations:
- experiment_id: lambdaber:md-exp-001
  sample_id: lambdaber:md-sample-001
  role: target

experiment_instrument_associations:
- experiment_id: lambdaber:md-exp-001
  instrument_id: lambdaber:gpu-cluster-001
  role: primary

# Link workflows to experiment
workflow_experiment_associations:
- workflow_id: lambdaber:wf-md-setup-001
  experiment_id: lambdaber:md-exp-001
- workflow_id: lambdaber:wf-md-min-001
  experiment_id: lambdaber:md-exp-001
- workflow_id: lambdaber:wf-md-heat-001
  experiment_id: lambdaber:md-exp-001
- workflow_id: lambdaber:wf-md-equil-001
  experiment_id: lambdaber:md-exp-001
- workflow_id: lambdaber:wf-md-prod-001
  experiment_id: lambdaber:md-exp-001

# Link input files to setup workflow
workflow_input_associations:
