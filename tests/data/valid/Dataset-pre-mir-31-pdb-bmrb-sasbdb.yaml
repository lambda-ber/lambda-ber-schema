# One solved RNA structure held in three archives.
#
# The solution NMR structure of human pre-miR-31 (Ma et al., PNAS 2023) was deposited three ways:
#   PDB 8FCS      - the 20-model NMR ensemble (coordinates, restraints)
#   BMRB 31061    - the NMR data behind it (chemical shifts, sample conditions), NMR-STAR
#   SASBDB SASDRF9 - SEC-SAXS data on the same RNA, with the 8FCS ensemble fitted against it
# The PDB entry names the BMRB entry; the SASBDB entry names the PDB entry, marking its model
# "identical" to 8FCS. Nothing in the PDB entry points to SASBDB.
#
# The RNA is one NucleicAcid row shared by every sample, named by its RNAcentral CURIE: the
# 71-nt construct is exactly the natural hsa-mir-31 stem-loop (miRBase MI0000089), so it is not a
# synthetic sequence that would need a lambda id. The NMR and SAXS samples are different
# preparations - different buffer, temperature and isotope labelling - so each is its own Sample,
# and what differs per preparation sits on SampleNucleicAcidAssociation.
#
# The deposited model file is the hinge between the two techniques: it is the output of the NMR
# refinement and the input of the SAXS fit. SASBDB serves its own copy of it; the coordinates of
# all 20 models match 8FCS exactly, but the header predates the PDB's 2024 revision of the entry,
# so the two files have different checksums. Both are recorded to show how a copy held by a second
# archive can be traced to the original. Checksums are of the files as downloaded on 2026-10-04.
id: lambdaber:dataset_pre_mir_31
title: pre-miR-31 solution structure across PDB, BMRB and SASBDB
description: >-
  Solution NMR structure of human precursor microRNA 31 (PDB 8FCS, BMRB 31061) with SEC-SAXS data
  on the same RNA (SASBDB SASDRF9) fitted against the NMR ensemble.
keywords:
- RNA
- pre-miRNA
- solution NMR
- SAXS
- cross-archive

