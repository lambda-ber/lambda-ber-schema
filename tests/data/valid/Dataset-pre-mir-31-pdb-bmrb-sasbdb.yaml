experiment_runs:
- id: pdb:8FCS/experiment
  title: pre-miR-31 solution NMR
  description: >-
    Twelve experiments across the labelled samples: 2D 1H-1H NOESY and TOCSY, 1H-13C and 1H-15N
    HSQC, BEST-sellr HNN-COSY for base pairing, and 1H-13C IPAP-HSQC in isotropic and aligned
    media for residual dipolar couplings. Collected with Bruker TopSpin.
  experiment_code: 8FCS-NMR
  technique: solution_nmr
  experimental_conditions:
    temperature:
      numeric_value: 310
      unit: K
    pressure:
      numeric_value: 1
      unit: atm
  acquisition_software: TopSpin
- id: sasbdb:SASDRF9/experiment
  title: pre-miR-31 SEC-SAXS
  description: >-
    SEC-SAXS, 2248 frames. s range 0.027-4.157 nm-1. Guinier Rg 2.877 nm; P(r) Rg 3.05 nm,
    Dmax 10.6 nm; Porod volume 31.0 nm3.
  experiment_code: SASBDB-SASDRF9-EXP
  experiment_date: '2023-03-19'
  technique: saxs
  experimental_conditions:
