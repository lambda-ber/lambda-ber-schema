    numeric_value: 1.033
    unit: Angstroms
  detector_distance:
    numeric_value: 3688
    unit: mm
  exposure_time:
    numeric_value: 0.2
    unit: s
  number_of_images:
    numeric_value: 2248
    unit: frames
  quality_metrics:
    i_zero:
      numeric_value: 0.012135
      unit: arbitrary
    rg:
      numeric_value: 2.877
      unit: nm

workflow_runs:
# NMR side: CYANA structure calculation, then Amber refinement; 640 conformers calculated, the 20
# lowest-energy deposited. Assignment (NMRViewJ 9.2.0-b24) and processing (NMRFx) precede these.
- id: pdb:8FCS/workflow/structure_calculation
  title: Structure calculation
  description: CYANA, from NOE distance, base-pairing and RDC restraints. 640 conformers calculated.
  workflow_code: 8FCS-CYANA
  workflow_type: model_building
  software_name: CYANA
  additional_software: NMRFx (processing); NMRViewJ 9.2.0-b24 (assignment)
- id: pdb:8FCS/workflow/refinement
  title: Refinement
  description: Amber simulated annealing; the 20 lowest-energy structures deposited.
  workflow_code: 8FCS-AMBER
  workflow_type: model_refinement
  software_name: Amber
  deposited_to_pdb: true
  pdb_id: 8FCS
# SAXS side
- id: sasbdb:SASDRF9/workflow/pddf
  title: Pair distance distribution
  description: Rg 3.05 nm, Dmax 10.6 nm, I(0) 0.01227
  workflow_code: SASBDB-SASDRF9-PDDF
  workflow_type: saxs_analysis
  software_name: ATSAS GNOM
  software_version: '5.0'
- id: sasbdb:SASDRF9/workflow/denss
  title: Electron density reconstruction
  workflow_code: SASBDB-SASDRF9-DENSS
  workflow_type: saxs_analysis
  software_name: DENSS
- id: sasbdb:SASDRF9/workflow/fit1
  title: Fit of the 8FCS ensemble to the SAXS curve
  description: 'Chi-square 0.912, p-value 0.0002. The model is the 8FCS ensemble, unchanged.'
  workflow_code: SASBDB-SASDRF9-FIT1
  workflow_type: saxs_analysis
  software_name: FoXS

