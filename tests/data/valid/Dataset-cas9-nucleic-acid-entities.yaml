# Demonstrates the NucleicAcid entity table and SampleNucleicAcidAssociation, alongside the
# Protein table for the same complex.
#
# Three strands are described once each: a single-guide RNA, the DNA target strand it pairs
# with, and the complementary non-target strand. Three samples reuse them. The Cas9-sgRNA-DNA
# ternary complex that was crystallized (PDB 4OO8) holds the protein and two of the strands.
# The sgRNA on its own, made by in vitro transcription for solution work, is the same
# NucleicAcid record with a 5' triphosphate it did not have in the complex. The target duplex
# on its own, annealed from two synthetic oligonucleotides with a fluorophore on one, is two
# rows pointing at two records. Everything that varies between the preparations - role, form,
# how the strand was made, labels, measured mass - sits on the association rows.
id: lambdaber:dataset-cas9-nucleic-acid-entities
title: Streptococcus pyogenes Cas9 with guide RNA and target DNA
description: Worked example of the NucleicAcid table shared by three samples, with the Protein
  table for the nuclease

# ===== ENTITY TABLES (FLAT COLLECTIONS) =====

studies:
- id: lambdaber:study-cas9-target-recognition
  title: Target recognition by Cas9-sgRNA

proteins:
- id: uniprot:Q99ZW2
  uniprot_id: uniprot:Q99ZW2
  protein_name: CRISPR-associated endonuclease Cas9/Csn1
  gene_name: cas9
  organism: NCBITaxon:301447
  organism_name: Streptococcus pyogenes serotype M1
  sequence_length: 1368
  molecular_weight_theoretical:
    numeric_value: 158.4
    unit: kilodaltons
  ec_numbers:
