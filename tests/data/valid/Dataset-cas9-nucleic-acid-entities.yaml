sample_nucleic_acid_associations:
# The complex: guide and target strand as they sit in the crystal. The sgRNA folds into stem
# loops and pairs its guide segment with the target strand, so no single structural_form
# fits it and the slot is left off. The target strand is present without its complement.
- sample_id: lambdaber:sample-cas9-sgrna-dna-complex
  nucleic_acid_id: lambdaber:na-sgrna-4oo8
  role: guide
  copy_number: 1
  chain_ids:
  - B
  source_method: in_vitro_transcription
- sample_id: lambdaber:sample-cas9-sgrna-dna-complex
  nucleic_acid_id: lambdaber:na-target-strand-4oo8
  role: binding_partner
  copy_number: 1
  chain_ids:
  - C
  structural_form: single_stranded
  source_method: chemical_synthesis
# The sgRNA alone: same record, but straight off the T7 reaction with its triphosphate on.
- sample_id: lambdaber:sample-sgrna-ivt
  nucleic_acid_id: lambdaber:na-sgrna-4oo8
  role: target
  copy_number: 1
  source_method: in_vitro_transcription
  modifications:
  - 5' triphosphate retained
  observed_molecular_weight:
    numeric_value: 31.9
    unit: kilodaltons
# The duplex alone: two strands, two rows, both double_stranded, one of them labelled.
- sample_id: lambdaber:sample-target-duplex-fam
  nucleic_acid_id: lambdaber:na-target-strand-4oo8
  role: subunit
  copy_number: 1
  structural_form: double_stranded
  source_method: chemical_synthesis
- sample_id: lambdaber:sample-target-duplex-fam
  nucleic_acid_id: lambdaber:na-nontarget-strand-4oo8
  role: subunit
  copy_number: 1
  structural_form: double_stranded
  source_method: chemical_synthesis
  modifications:
  - 5' 6-FAM
