nucleic_acids:
# The guide: an RNA with no registry entry, so a local id. The 5' GG is the T7 start and
# not part of the guide sequence, which is why the record says so rather than leaving it out.
- id: lambdaber:na-sgrna-4oo8
  nucleic_acid_type: rna
  nucleic_acid_name: Single-guide RNA, 98-mer
  title: sgRNA used in PDB 4OO8
  description: 20-nucleotide guide segment followed by the crRNA repeat, tetraloop, tracrRNA
    anti-repeat and stem loops. Begins with GG for T7 transcription.
  organism: NCBITaxon:32630
  organism_name: synthetic construct
  nucleotide_sequence: GGAAAUUAGGUGCGCUUGGCGUUUUAGAGCUAGAAAUAGCAAGUUAAAAUAAGGCUAGUCCGUUAUCAACUUGAAAAAGUGGCACCGAGUCGGUGCUU
  sequence_length: 98
  molecular_weight_theoretical:
    numeric_value: 31.7
    unit: kilodaltons
  pdb_entries:
  - pdb:4OO8
# The target strand: complementary to the guide segment, with the 5' CCA that pairs with
# the TGG PAM on the other strand.
- id: lambdaber:na-target-strand-4oo8
  nucleic_acid_type: dna
  nucleic_acid_name: Target DNA strand, 23-mer
  organism: NCBITaxon:32630
  organism_name: synthetic construct
  nucleotide_sequence: CCAGCCAAGCGCACCTAATTTCC
  sequence_length: 23
  molecular_weight_theoretical:
    numeric_value: 6.93
    unit: kilodaltons
  pdb_entries:
  - pdb:4OO8
# The non-target strand: reverse complement of the target strand, carrying the PAM. Absent
# from the crystal, present in the solution duplex.
- id: lambdaber:na-nontarget-strand-4oo8
  nucleic_acid_type: dna
  nucleic_acid_name: Non-target DNA strand, 23-mer
  organism: NCBITaxon:32630
  organism_name: synthetic construct
  nucleotide_sequence: GGAAATTAGGTGCGCTTGGCTGG
  sequence_length: 23
  molecular_weight_theoretical:
    numeric_value: 7.16
    unit: kilodaltons

