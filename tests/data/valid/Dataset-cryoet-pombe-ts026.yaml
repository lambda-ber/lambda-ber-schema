# Run TS_026 of Biohub CryoET Data Portal dataset DS-10000 (CC0): an S. pombe
# cryo-FIB lamella imaged by defocus cryo-ET, aligned by patch tracking and
# reconstructed by weighted back-projection in IMOD. Values come from the
# portal's dataset, tilt-series, alignment and tomogram metadata; see
# src/docs/background/czi-cryoet-examples/. Credit: de Teresa Trueba et al.
id: lambdaber:dataset_cryoet_pombe_ts026
title: S. pombe cells with defocus, run TS_026
description: Defocus cryo-ET of S. pombe cryo-FIB lamellae, one run with its alignment and tomogram
keywords:
- cryo-electron tomography
- Schizosaccharomyces pombe
studies:
- id: lambdaber:study_cdp_ds10000
  title: S. pombe cells with defocus
  description: Defocus cryo-electron tomography of S. pombe cryo-FIB lamellae with comprehensive annotations of structures and macromolecules
instruments:
- id: lambdaber:instrument_cdp_ds10000_krios
  instrument_type: CryoEMInstrument
  title: Krios with K2 Summit and GIF Quantum LS
  instrument_code: DS-10000-KRIOS
  manufacturer: Thermo Fisher Scientific
  model: Krios
  accelerating_voltage:
    numeric_value: 300
    unit: kV
  cs:
    numeric_value: 2.7
    unit: mm
  detector_manufacturer: Gatan
  detector_model: K2 Summit
  energy_filter_present: true
  energy_filter_make: Gatan
  energy_filter_model: GIF Quantum LS
samples:
- id: lambdaber:sample_pombe_972h_lamella
  title: S. pombe 972h- cells, cryo-FIB lamella
  description: Vegetative fission yeast cells, plunge-frozen and milled to lamellae
  sample_code: DS-10000-POMBE
  sample_type: cell
  organism: NCBITaxon:4896
  strain_or_cell_line: NCBITaxon:284812
experiment_runs:
- id: lambdaber:exp_cdp_ts026
  title: Tilt series TS_026
  experiment_code: DS-10000-TS_026
  technique: cryo_et
  accelerating_voltage:
    numeric_value: 300
    unit: kV
  cs:
    numeric_value: 2.7
    unit: mm
  calibrated_pixel_size:
    numeric_value: 3.3702
    unit: Angstroms per pixel
  total_dose:
    numeric_value: 122
    unit: electrons per Angstrom squared
  tilting_scheme: dose_symmetric
  tilt_angle_min:
    numeric_value: -43.9991
    unit: degrees
  tilt_angle_max:
    numeric_value: 42.0004
    unit: degrees
  tilt_angle_increment:
    numeric_value: 2
    unit: degrees
  tilt_axis_angle:
    numeric_value: 84.7
    unit: degrees
  number_of_tilt_images:
    numeric_value: 44
    unit: images
  acquisition_software: SerialEM
workflow_runs:
- id: lambdaber:workflow_ts026_alignment
  title: TS_026 tilt-series alignment
  workflow_code: WF-TS026-ALN-100
  workflow_type: tilt_series_alignment
  software_name: IMOD
  processing_parameters: patch tracking, non-fiducial
- id: lambdaber:workflow_ts026_reconstruction
  title: TS_026 tomogram reconstruction
  workflow_code: WF-TS026-RECON-100
  workflow_type: tomogram_reconstruction
  software_name: IMOD
  processing_parameters: weighted back-projection at 13.48 Angstrom voxel spacing; not CTF corrected
