  - GO:0005344
  pdb_entries:
  - pdb:1HHO
- id: uniprot:P68871
  uniprot_id: uniprot:P68871
  protein_name: Hemoglobin subunit beta
  gene_name: HBB
  organism: NCBITaxon:9606
  organism_name: Homo sapiens
