      numeric_value: 7.4
      unit: pH units
    components:
    - 50 mM sodium phosphate
    - 100 mM NaCl
- id: lambdaber:sample-hba1-fragment-his6
  sample_code: HBA1-FRAG-002
  sample_type: protein
  title: His6-tagged alpha chain fragment, residues 1-100
  protein_name: Hemoglobin subunit alpha
  organism: NCBITaxon:9606
  tag: His6
  construct: residues 1-100
  expression_system: Escherichia coli BL21(DE3)
  concentration:
    numeric_value: 3.5
    unit: milligrams per milliliter

# ===== ASSOCIATION TABLES (M:N RELATIONSHIPS) =====

study_sample_associations:
- study_id: lambdaber:study-hemoglobin
  sample_id: lambdaber:sample-hba-oxy-tetramer
  role: target
- study_id: lambdaber:study-hemoglobin
  sample_id: lambdaber:sample-hba1-fragment-his6
  role: reference

sample_protein_associations:
# The tetramer: two copies of each chain, full length, mass measured by native MS.
- sample_id: lambdaber:sample-hba-oxy-tetramer
  protein_id: uniprot:P69905
  role: subunit
  copy_number: 2
  chain_ids:
  - A
  - C
  observed_molecular_weight:
    numeric_value: 15.13
    unit: kilodaltons
- sample_id: lambdaber:sample-hba-oxy-tetramer
  protein_id: uniprot:P68871
  role: subunit
  copy_number: 2
  chain_ids:
  - B
  - D
  observed_molecular_weight:
    numeric_value: 15.87
    unit: kilodaltons
# The fragment: same Protein record, but a truncation with its tag still on.
- sample_id: lambdaber:sample-hba1-fragment-his6
  protein_id: uniprot:P69905
  role: target
  construct_id: lambdaber:construct-hba1-his6-nterm
  copy_number: 1
  residue_range: 1-100
  sequence_coverage: 0.71
  modifications:
  - N-terminal His6 tag retained
  observed_molecular_weight:
    numeric_value: 12.9
    unit: kilodaltons
