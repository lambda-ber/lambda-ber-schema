# Demonstrates the Protein entity table and SampleProteinAssociation.
#
# Two proteins (hemoglobin alpha and beta) are described once each. Two samples reuse them:
# the intact oxyhemoglobin tetramer, and a truncated His-tagged alpha chain from a separate
# preparation. Everything that varies between the two preparations - copy number, residue
# range, tags, measured mass - sits on the association rows, not on the Protein records.
id: lambdaber:dataset-hemoglobin-protein-entities
title: Human hemoglobin - tetramer and isolated alpha chain
description: Worked example of the Protein table shared by two samples

# ===== ENTITY TABLES (FLAT COLLECTIONS) =====

studies:
- id: lambdaber:study-hemoglobin
  title: Oxygen binding in human hemoglobin

proteins:
- id: uniprot:P69905
  uniprot_id: uniprot:P69905
  protein_name: Hemoglobin subunit alpha
  gene_name: HBA1
  organism: NCBITaxon:9606
  organism_name: Homo sapiens
  amino_acid_sequence: VLSPADKTNVKAAWGKVGAHAGEYGAEALERMFLSFPTTKTYFPHFDLSHGSAQVKGHGKKVADALTNAVAHVDDMPNALSALSDLHAHKLRVDPVNFKLLSHCLLVTLAAHLPAEFTPAVHASLDKFLASVSTVLTSKYR
  sequence_length: 141
