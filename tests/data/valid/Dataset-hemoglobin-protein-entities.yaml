    unit: kilodaltons
  go_terms:
  - GO:0005344
  pdb_entries:
  - pdb:1HHO

protein_constructs:
- id: lambdaber:construct-hba1-his6-nterm
  construct_id: HBA1-His6-N
  protein_id: uniprot:P69905
  uniprot_id: uniprot:P69905
  gene_name: HBA1
  construct_description: Alpha chain residues 1-100 with an N-terminal His6 tag
  vector_backbone: pET-28a
  tag_nterm: His6
  cleavage_site: ENLYFQS (TEV)
  insert_boundaries: 1-100

samples:
- id: lambdaber:sample-hba-oxy-tetramer
  sample_code: HBA-OXY-001
  sample_type: complex
  title: Oxyhemoglobin A tetramer from erythrocyte lysate
  protein_name: Hemoglobin A (oxy)
  organism: NCBITaxon:9606
  oligomeric_state: heterotetramer
  molecular_weight:
    numeric_value: 64.5
    unit: kilodaltons
  concentration:
    numeric_value: 12.0
    unit: milligrams per milliliter
  buffer_composition:
