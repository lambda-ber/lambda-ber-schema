# NW-BRaVE cyanophage CP12 molecular dynamics release (Zenodo 10.5281/zenodo.21536143).
#
# The first GROMACS example and the first MD dataset with real published files. Every size, md5
# checksum, chain assignment, sequence and simulation parameter is read from the record: the Zenodo
# API, the zip central directories, the reference PDBs and the .mdp files. Nothing is invented.
# Generated by a script, then checked in; regenerate rather than hand-edit if the source changes.
#
# Gaps this example exposes (values kept as description text):
#   - no slot for MD-computed binding energies (MM/GBSA) or buried surface area
#   - replicates are separate WorkflowRuns with nothing grouping them
#   - no Dataset or Study slot for the Zenodo, EMSL, MassIVE and preprint DOIs
#   - PTMTypeEnum has no disulfide or sulfenylation; InteractionEvidenceEnum has no simulation term
#   - DatabaseCrossReference has no UniParc, so the MED4 CP12 UniParc id is in its description
#   - WorkflowInputAssociation.input_type and WorkflowOutputAssociation.output_type are cryo-EM shaped:
#     no trajectory, starting structure or analysis-table terms (processed_data, model, statistics used)
#   - FileFormatEnum has no tsv, fasta, hmm, stockholm, mdp or tpr (tsv is written as ascii)
#   - InstrumentCategoryEnum and FacilityEnum have no HPC system or computing facility
#   - the sequence-family work (CP12 family build, HMM column metrics) has no WorkflowTypeEnum term,
#     so only its archives appear as DataFiles
#   - the 2 x 1,012 PTM systems are each one Sample row; topol.top, water model and ion setup are
#     not in the release, so MDSimulationParameters leaves them unset

id: lambda:nwbrave-cp12-dataset
title: 'Cyanophage CP12 remodels the Prochlorococcus MED4 dark complex: MD trajectories and analyses'
description: 'Molecular dynamics of the GAP2-CP12-PRK ''dark complex'' of Prochlorococcus marinus MED4, with the
  host CP12 or the cyanophage P-HM2 CP12, in reduced (0000) and oxidized (0003) states, three 100 ns GROMACS replicates
  each, plus a 1,012-system cysteine PTM combinatorial set per variant. Released as Zenodo record doi:10.5281/zenodo.21536143
  (NW-BRaVE community, CC-BY-4.0, 2026-07-24), supporting the bioRxiv preprint doi:10.64898/2026.09.10.750766. Companion
  data: EMSL project 61054 releases doi:10.25582/data.2026-08.3856177/3407882 (MED4) and doi:10.25582/data.2026-08.3853205/3407881
  (MED4 with phage P-HM2), and MassIVE MSV000102848 (proteomics). None of these four links has a home in the schema
  yet, so they are recorded here as text.'
keywords:
- molecular dynamics
- CP12
- Calvin cycle
- dark complex
- cyanophage
- Prochlorococcus
- redox regulation
- post-translational modification
- NW-BRaVE
studies:
- id: lambda:nwbrave-cp12-study
  title: Cyanophage CP12 Rewires Host Carbon Regulation through Interface Remodeling and Redox Buffering
  description: How the cyanophage P-HM2 CP12 changes the interfaces CP12 makes with GAP2 and PRK in the Prochlorococcus
    MED4 dark complex, across redox states and cysteine PTM states.
  proposal_id: EMSL-61054
  keywords:
  - virus-host interaction
  - carbon fixation
  - molecular dynamics
