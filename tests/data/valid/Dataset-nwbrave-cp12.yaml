workflow_runs:
- id: lambda:nwbrave-cp12-wf-med4-0000-min
  title: MED4-0000 restrained minimization cascade
  description: Steepest descent with Protein position restraints stepped down 1000, 500, 100, 50, 10, 5, 1 kJ/mol/nm^2
    (minim1000.mdp ... minim1.mdp). Run once per replicate.
  workflow_code: MED4-0000-MIN
  workflow_type: md_minimization
  software_name: GROMACS
  software_version: '2025.0'
  parameters_file_path: MD_Simulations/0000_0003/minim1000.mdp
  md_simulation_params:
    simulation_engine: GROMACS
    simulation_engine_version: '2025.0'
    protein_force_field: AMBER99SB
    simulation_stage: minimization_restrained
    restraint_mask: Protein
    restraint_force_constant:
      numeric_value: 1000
      unit: kJ/mol/nm^2
    minimization_max_cycles:
      numeric_value: 50000
      unit: cycles
    minimization_steepest_descent_cycles:
      numeric_value: 50000
