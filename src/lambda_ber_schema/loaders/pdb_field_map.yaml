  pdbx_database_status.recvd_initial_deposition_date: {derived: "same date as rcsb_accession_info.deposit_date"}
  pdbx_database_status.status_code: {bookkeeping: "release status of the coordinates"}
  pdbx_database_status.status_code_sf: {to: "DataFile.file_path", as: "REL lists the structure factor file"}
  pdbx_database_status.status_code_mr: {to: "DataFile.file_path", as: "REL lists the NMR restraint file"}
  pdbx_database_status.status_code_cs: {to: "DataFile.file_path", as: "REL lists the chemical shift file"}
  pdbx_database_status.pdb_format_compatible: {to: "DataFile.file_path", as: "Y lists the legacy PDB-format file"}
  pdbx_database_status.SG_entry: {derived: "true exactly when pdbx_SG_project is present"}
  pdbx_database_status.deposit_site: {bookkeeping: "wwPDB site that received the deposition"}
