  rcsb_entry_info.disulfide_bond_count: {linked_file: "computed from the coordinates in the mmCIF file"}
  rcsb_entry_info.inter_mol_covalent_bond_count: {linked_file: "computed from the coordinates in the mmCIF file"}
  rcsb_entry_info.inter_mol_metalic_bond_count: {linked_file: "computed from the coordinates in the mmCIF file"}
  rcsb_entry_info.ndb_struct_conf_na_feature_combined: {linked_file: "nucleic acid conformation computed from the coordinates"}

