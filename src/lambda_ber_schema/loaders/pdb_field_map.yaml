  pdbx_database_status.methods_development_category: {to: "Study.keywords"}
  pdbx_audit_revision_category: {bookkeeping: "revision audit trail; the latest revision is Dataset.revision"}
  pdbx_audit_revision_details: {bookkeeping: "revision audit trail"}
  pdbx_audit_revision_group: {bookkeeping: "revision audit trail"}
  pdbx_audit_revision_history: {bookkeeping: "revision audit trail"}
  pdbx_audit_revision_item: {bookkeeping: "revision audit trail"}
  database_2: {to: "Study.database_cross_references"}
  database_2[].pdbx_database_accession: {derived: "the extended PDB id, pdb_0000 plus the entry id"}
  rcsb_external_references: {to: "Study.database_cross_references"}
  pdbx_database_related: {to: "Study.database_cross_references"}
  pdbx_database_PDB_obs_spr: {to: "Study.database_cross_references"}
  pdbx_database_PDB_obs_spr[].id: {join: "OBSLTE or SPRSDE, written into the cross-reference description"}
  pdbx_deposit_group: {to: "Study.database_cross_references"}
  pdbx_related_exp_data_set: {to: "DataFile.file_path"}
  rcsb_entry_group_membership: {reference: "RCSB grouping of entries by composition"}

  rcsb_entry_container_identifiers: {join: "ids of the records fetched alongside the entry"}
  rcsb_entry_container_identifiers.emdb_ids: {to: "Study.database_cross_references"}
  rcsb_entry_container_identifiers.related_emdb_ids: {to: "Study.database_cross_references"}
  rcsb_entry_container_identifiers.pubmed_id: {to: "Publication.pubmed_id", as: "written pmid:<id>"}
  rcsb_entry_container_identifiers.water_entity_ids: {join: "water is not listed as a sample component"}

  rcsb_entry_info: {derived: "counts and ranges RCSB computes over the entities, which are carried"}
  rcsb_entry_info.molecular_weight: {to: "Sample.molecular_weight"}
  rcsb_entry_info.resolution_combined: {to: "QualityMetrics.resolution"}
  rcsb_entry_info.nonpolymer_bound_components: {to: "SampleComponentInteraction.interaction_type", as: "a bound ion is_coordinated_by its chain, a bound non-ion is covalently_linked_to it"}
