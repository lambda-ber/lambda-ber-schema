# Where every field the RCSB Data API can return ends up in a lambda-ber-schema Dataset.
#
# The fields are the leaf paths in pdb_rcsb_fields.json, which lists everything RCSB's
# published JSON schemas allow for each kind of record the PDB loader fetches. A key here
# is a path or a path prefix; the longest key that matches a field decides its disposition.
# A prefix matches a field when the field equals it or continues it with "." or "[]".
#
# Each rule has exactly one of these keys:
#
#   to:           the field is carried in a named schema slot, written Class.slot
#   metric:       the field is carried in additional_metrics (numbers) or additional_properties
#                 (text) of the named class, keyed by its mmCIF or RCSB item name; the loader
#                 emits these generically from this file, so marking a field metric is enough
#   derived:      the field can be recomputed from fields that are carried (the reason says how)
#   reference:    general knowledge RCSB imports about the molecule or chemical from another
#                 resource (UniProt, ChEMBL, DrugBank, sequence clusters, computed features), not
#                 a fact about this deposition; reachable through the cross-reference carried
#   linked_file:  per-atom or per-operator data held in a file the Dataset links (named)
#   join:         an identifier used only to connect records; the loader consumes it
#   bookkeeping:  archive housekeeping: audit trails, processing sites, schema versions
#   out_of_scope: belongs to a kind of entry the loader does not load (the reason says which)
#
# A "to" rule may add "as:" when the value is transformed on the way (an enum lookup, a unit
# label, a date trimmed to YYYY-MM-DD), which exempts it from the verbatim check in
# tests/loaders/test_pdb_coverage.py. Every other "to" and "metric" field found in the test
# fixtures must appear verbatim in the loader's output.

entry:
  rcsb_id: {join: "the entry id; Dataset.id is pdb:<entry id>"}
  entry.id: {join: "same as rcsb_id"}
  entry.ma_collection_id: {out_of_scope: "computed structure models (ModelArchive) are not experimental entries"}

