  struct.pdbx_CASP_flag: {bookkeeping: "CASP target flag"}
  struct_keywords.pdbx_keywords: {to: "Study.keywords"}
  struct_keywords.text: {to: "Study.keywords", as: "split on commas"}
  rcsb_accession_info.deposit_date: {to: "Dataset.deposition_date", as: "trimmed to YYYY-MM-DD"}
  rcsb_accession_info.initial_release_date: {to: "Dataset.release_date", as: "trimmed to YYYY-MM-DD"}
  rcsb_accession_info.revision_date: {to: "Dataset.last_revision_date", as: "trimmed to YYYY-MM-DD"}
  rcsb_accession_info.major_revision: {to: "Dataset.revision", as: "written major.minor"}
  rcsb_accession_info.minor_revision: {to: "Dataset.revision", as: "written major.minor"}
  rcsb_accession_info.status_code: {bookkeeping: "always REL for an entry that can be loaded"}
