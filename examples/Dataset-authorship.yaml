id: lambdaber:dataset_authorship
title: Authorship and people provenance example
description: 'Demonstrates the Person entity table and the three person association
  tables. The same person record serves several roles across the dataset - Clyde Smith
  is both an author of the study and the operator who collected the data - which is
  the point of keeping role on the association rather than on the person. Organizations
  work the same way: SLAC is stated once and referred to by the instrument, by an
  affiliation and by the study, rather than restated in each.'
studies:
- id: lambdaber:study_expansin
  title: Bacterial expansin structure and cellulose loosening
  description: Crystallographic study of Xa_EXLX1 from Xanthomonas sacchari
  keywords:
  - expansin
  - carbohydrate-binding
