id: lambdaber:dataset-prokaryotic-vault-l05
title: Phage L05 vault nanocapsule - cryo-EM structure and engineered wall expansion
description: 'Worked example covering the structural half of Athukoralage et al.,
  "Prokaryotic homologs of the major vault protein form engineerable vault nanocapsules"
  (bioRxiv 2026.11.04.764334). Tracks one bacteriophage MVP homolog (L05) from construct
  through E. coli expression, size-exclusion capture, cryo-EM and model building,
  beside the human MVP control expressed in Sf9 cells. Exercises the prediction-as-experimental-reference
  pattern: an OpenFold3 whole-shell model supplies the starting reference for refinement,
  because ab initio maps could not distinguish the vault from its mirror image. No
  PDB, EMDB or EMPIAR accessions had been released when this example was written,
  so file names are placeholders and no checksums or storage URIs are asserted. Several
  facts from the paper have no slot in the schema and are carried as free text here;
  each is marked "SCHEMA GAP" in the description of the record that carries it.'
keywords:
- cryo-EM
- vault
- major vault protein
- bacteriophage
- protein nanocapsule
- structure prediction
studies:
- id: lambdaber:study-prokaryotic-vaults
  title: Prokaryotic and bacteriophage MVP homologs form vault particles
  description: Survey of the MVP family across ~15 billion predicted proteins, followed
    by heterologous expression and structural characterization of selected homologs.
    Only the structural work is represented here; the sequence survey, phylogenetics
    and gene-neighborhood analyses are out of scope for this schema.
  keywords:
  - vault
  - prokaryotic homolog
instruments:
- id: lambdaber:instrument-krios-g4-tfs
  title: Titan Krios G4 with Falcon 4i and energy filter
  description: 'Operated at the Thermo Fisher Scientific Cryo-EM Drug Discovery Center.
    SCHEMA GAP: facility_name is bound to FacilityEnum, a closed list of synchrotron
    and neutron sources, so a commercial or vendor cryo-EM centre cannot be named;
    the slot is left unset, per its own guidance for laboratory instruments.'
  instrument_code: KRIOS-G4-CRYOEM-DDC
  instrument_type: CryoEMInstrument
  instrument_category: ELECTRON_MICROSCOPE
  manufacturer: Thermo Fisher Scientific
  model: Titan Krios G4
  current_status: operational
  accelerating_voltage:
    unit: kilovolts
    numeric_value: 300.0
  detector_technology: direct_electron_detector
  detector_manufacturer: Thermo Fisher Scientific
  detector_model: Falcon 4i
  detector_mode: counting
  energy_filter_present: true
  energy_filter_slit_width:
    unit: eV
    numeric_value: 10.0
  microscope_software: EPU
proteins:
- id: lambdaber:protein-l05
  title: Phage L05 major vault protein homolog
  description: MVP homolog encoded by an uncultured bacteriophage, recovered from
    a metagenomic survey. 866 residues with seven wall repeats, a shoulder (SPFH)
    domain, a cap helix and a C-terminal region. Assembles into a 96-chain vault.
    Member of the MVP-1 cluster, which carries seven wall repeats and an ~80-residue
    linker loop between the sixth and seventh repeats. No UniProt accession exists;
    a local identifier is used. Source phage is uncultured and unnamed.
  protein_name: Major vault protein homolog L05
- id: uniprot:Q14764
  title: Human major vault protein
  description: Control protein for the size-exclusion capture method. 893 residues
    with nine wall repeats; assembles into the 78-chain mammalian vault.
  uniprot_id: uniprot:Q14764
  protein_name: Major vault protein
  gene_name: MVP
  organism: NCBITaxon:9606
  organism_name: Homo sapiens
  pdb_entries:
  - pdb:9BW6
- id: lambdaber:protein-c0
  title: Phage C0 major vault protein homolog
  description: MVP homolog from an uncultured bacteriophage, confirmed as a vault
    by cryo-EM. Included here because its predicted whole-shell model was the only
    one subjected to energy minimization.
  protein_name: Major vault protein homolog C0
