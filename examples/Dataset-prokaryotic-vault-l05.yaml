workflow_runs:
- id: lambdaber:workflow-l05-shell-prediction
  title: OpenFold3 whole-shell prediction of the L05 vault
  description: 'Pairs of full-length chains co-folded without templates from unpaired
    ColabFold alignments. Predictions were kept when the chains lay side by side with
    continuous cap helices 8-11.5 A apart. C-alpha distances below 14 A between neighboring
    chains, present in at least half of the pooled predictions, became restraints
    used to optimize one chain so that 48 exact copies about one axis satisfied them;
    the second half was generated by a two-fold axis 1.5 A from the first at the waist.
    127 of 150 predictions were usable; the model covers residues 8-798 of 866 and
    was not energy-minimized. Handedness was checked against the human vault. SCHEMA
    GAP: no slot records handedness determination.'
  workflow_code: WF-L05-OF3-SHELL
  workflow_type: structure_prediction
  software_name: OpenFold3
  software_version: 0.5.0
  additional_software: OpenBind-0 weights; ColabFold alignments
  processing_parameters: 48 chains per half; no templates; unpaired MSAs; restraint
    cutoff 14 A C-alpha; two-fold axis offset 1.5 A at the waist
- id: lambdaber:workflow-c0-shell-relaxation
  title: Energy minimization of the predicted C0 vault shell
  description: The only predicted whole-vault model that was relaxed. 73 of 100 predictions
    were usable.
  workflow_code: WF-C0-OPENMM-RELAX
  workflow_type: md_minimization
  software_name: OpenMM
  software_version: '8.2'
  md_simulation_params:
    simulation_engine: OpenMM
    simulation_engine_version: '8.2'
    protein_force_field: Amber ff14SB
    simulation_stage: minimization_unrestrained
- id: lambdaber:workflow-l05-motioncorr
  title: Motion correction of L05 movies
  workflow_code: WF-L05-MOTIONCORR
  workflow_type: motion_correction
  software_name: RELION
  software_version: 5.0.1
  additional_software: MotionCor2 implementation
  motion_correction_params:
    dose_weighting: true
- id: lambdaber:workflow-l05-ctf
  title: CTF estimation for L05 micrographs
  workflow_code: WF-L05-CTFFIND
  workflow_type: ctf_estimation
  software_name: CTFFIND
  software_version: 4.1.14
  processing_parameters: 3,007 of 3,041 micrographs fit to 6 A or better were carried
    forward
- id: lambdaber:workflow-l05-picking
  title: Particle picking for L05
  workflow_code: WF-L05-TOPAZ
  workflow_type: particle_picking
  software_name: Topaz
  particle_picking_params:
    picking_method: neural_network
    model_source: trained in-house on manually selected particles
  number_of_particles: 34337
- id: lambdaber:workflow-l05-class2d
  title: 2D classification of L05 particles
  description: 28,358 particles retained, of which 19,389 were complete vaults.
  workflow_code: WF-L05-CLASS2D
  workflow_type: classification_2d
  software_name: RELION
  software_version: 5.0.1
  number_of_particles: 28358
- id: lambdaber:workflow-l05-abinitio
  title: Ab initio reconstruction of L05
  description: Three-class ab initio without symmetry from the complete vaults. The
    resulting maps did not distinguish the vault from its mirror image, so refinement
    was started from the filtered prediction instead.
  workflow_code: WF-L05-ABINITIO
  workflow_type: ab_initio
  software_name: RELION
  software_version: 5.0.1
  number_of_particles: 19389
- id: lambdaber:workflow-l05-class3d
  title: 3D classification of L05 particles
  description: Four-class 3D classification without symmetry, using references derived
    from the ab initio maps. 11,945 vaults were closed and also complete in 2D classification.
  workflow_code: WF-L05-CLASS3D
  workflow_type: classification_3d
  software_name: RELION
  software_version: 5.0.1
  number_of_particles: 11945
- id: lambdaber:workflow-l05-consensus-refine
  title: Consensus refinement of the L05 vault
  description: 'Refinement under D16 symmetry from a 20 A smoothened shell of the
    predicted model, with CTF refinement and 3D classification-based cleanup against
    decoy references. SCHEMA GAP: D16 is not a permissible value of SymmetryEnum,
    which stops at D10, so the symmetry slot is left unset and recorded here instead.
    Refinements without symmetry from a featureless reference preferentially showed
    48 ribs around the wall.'
  workflow_code: WF-L05-REFINE-D16
  workflow_type: refinement
  software_name: RELION
  software_version: 5.0.1
  processing_parameters: D16 symmetry; starting reference low-pass filtered to 20
    A
  refinement_params:
    pixel_size:
      unit: Angstroms
      numeric_value: 0.937
    gold_standard: true
    resolution_0_143:
      unit: Angstroms
      numeric_value: 3.5
  number_of_particles: 11675
- id: lambdaber:workflow-l05-local-waist
  title: Localized refinement of the L05 waist
  description: 'SCHEMA GAP: one of five local refinements whose mean is the reported
    nominal resolution of 3.2 A. Nothing in the schema links a local refinement to
    its parent consensus refinement, nor records that the overlapping regions were
    obtained by symmetry expansion and localized reconstruction and then merged into
    a composite map.'
  workflow_code: WF-L05-LOCAL-WAIST
  workflow_type: refinement
  software_name: RELION
  software_version: 5.0.1
  processing_parameters: symmetry expansion then local refinement without symmetry
  refinement_params:
    resolution_0_143:
      unit: Angstroms
      numeric_value: 2.95
- id: lambdaber:workflow-l05-local-barrel
  title: Localized refinement of the L05 barrel
  workflow_code: WF-L05-LOCAL-BARREL
  workflow_type: refinement
  software_name: RELION
  software_version: 5.0.1
  refinement_params:
    resolution_0_143:
      unit: Angstroms
      numeric_value: 3.02
- id: lambdaber:workflow-l05-local-shoulder
  title: Localized refinement of the L05 shoulder
  workflow_code: WF-L05-LOCAL-SHOULDER
  workflow_type: refinement
  software_name: RELION
  software_version: 5.0.1
  refinement_params:
    resolution_0_143:
      unit: Angstroms
      numeric_value: 3.39
- id: lambdaber:workflow-l05-local-caphelix
  title: Localized refinement of the L05 cap helices
  workflow_code: WF-L05-LOCAL-CAPHELIX
  workflow_type: refinement
  software_name: RELION
  software_version: 5.0.1
  refinement_params:
    resolution_0_143:
      unit: Angstroms
      numeric_value: 3.24
- id: lambdaber:workflow-l05-cap-refine
  title: Refinement of the L05 cap disk
  description: '23,404 caps from 11,702 separately selected vaults. Refined under
    C16; the tip was reconstructed under C8. SCHEMA GAP: C16 is not a permissible
    value of SymmetryEnum.'
  workflow_code: WF-L05-CAP-C16
  workflow_type: refinement
  software_name: RELION
  software_version: 5.0.1
  processing_parameters: C16 symmetry for the cap; C8 for the tip
  refinement_params:
    resolution_0_143:
      unit: Angstroms
      numeric_value: 3.3
  number_of_particles: 23404
- id: lambdaber:workflow-l05-composite
  title: Composite map assembly for L05
  description: 'Local maps merged into one composite map. Sub-particle extraction,
    cap sorting, geometric mask construction, composite map assembly, the check for
    fitted noise and directional FSC were performed with custom Python scripts, because
    RELION has no job type for them. SCHEMA GAP: no workflow type for composite map
    assembly, and no way to record software that has no release version.'
  workflow_code: WF-L05-COMPOSITE
  workflow_type: postprocessing
  software_name: custom Python scripts
  processing_parameters: nominal resolution 3.2 A reported as the mean of the five
    local refinement values (2.95, 3.02, 3.39, 3.24, 3.30 A)
- id: lambdaber:workflow-l05-model-building
  title: Model building into the L05 composite map
  description: An AlphaFold2 model was docked into the map, the cap helix was built
    from ideal helices, and the end of the chain was built in the C16 and C8 maps.
  workflow_code: WF-L05-COOT
  workflow_type: model_building
  software_name: Coot
  software_version: 1.3.3
  additional_software: AlphaFold2 via ColabFold 1.6.1
- id: lambdaber:workflow-l05-model-refinement
  title: Refinement of the L05 atomic model
  description: Refined under strict symmetry with residue-by-residue inspection. D8
    symmetry generates the 96 chains of the model from six, which adopt four conformations
    (A, B, C and C-prime) that differ beyond residue 788. Each chain contains 717
    to 724 of the 866 residues.
  workflow_code: WF-L05-SERVALCAT
  workflow_type: model_refinement
  software_name: Servalcat
  software_version: 0.4.131
  refinement_params:
    symmetry: D8
- id: lambdaber:workflow-l05-ligand-search
  title: Density-fit screen for the unassigned lumenal density
  description: 'A computational search of 25,000 molecules against the unassigned
    density ranked coenzyme A and its derivatives highest. SCHEMA GAP: there is no
    ligand_identification value in WorkflowTypeEnum; map_validation is used as the
    nearest fit.'
  workflow_code: WF-L05-LIGAND-SEARCH
  workflow_type: map_validation
  software_name: not stated in the main text
  processing_parameters: 25,000 candidate molecules scored against the unassigned
    density
- id: lambdaber:workflow-l05-plus2-halves-refine
  title: Half-vault refinement of L05+2
  description: 'Whole-vault refinement under D16 did not reach Nyquist, so each half
    was treated as a separate particle. 35,558 halves reached 4.2 A under C48 at 1.25
    A per pixel. Refinement to convergence increased the difference between the half
    maps in the shells from 4.7 to 3.5 A, which the authors report as evidence of
    some fitted noise. SCHEMA GAP: C48 is not a permissible value of SymmetryEnum,
    and there is no slot for a self-reported fitted-noise check.'
  workflow_code: WF-L05P2-HALVES-C48
  workflow_type: refinement
  software_name: RELION
  processing_parameters: C48 symmetry on isolated halves; 1.25 A per pixel
  refinement_params:
    pixel_size:
      unit: Angstroms
      numeric_value: 1.25
    gold_standard: true
    resolution_0_143:
      unit: Angstroms
      numeric_value: 4.2
  number_of_particles: 35558
