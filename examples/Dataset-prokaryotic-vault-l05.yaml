sample_component_interactions:
- sample_id: lambdaber:sample-l05-vault
  subject_id: lambdaber:component-l05-unknown-ligand
  object_id: lambdaber:component-l05-shell
  interaction_type: binds
  interaction_status: expected
  subject_site: unassigned density at the repeat seam, lumenal face
  object_site: basic pocket between neighboring chains, repeats 1 and 2
  evidence:
  - experimental
  - predicted
  description: Cryo-EM density not accounted for by the protein model; a computational
    fit of 25,000 candidate molecules ranked coenzyme A and its derivatives highest.
    The ligand is NOT identified, so interaction_status is "expected". Analogous to
    NAD+ and related nucleotides binding the lumenal wall of the human vault.
