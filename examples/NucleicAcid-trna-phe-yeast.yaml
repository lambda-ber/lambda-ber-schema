id: rnacentral:URS000011107D
title: Yeast phenylalanine tRNA
description: Mature cytoplasmic tRNA-Phe of Saccharomyces cerevisiae, 76 nucleotides.
  The first tRNA structure solved and the reference L-shaped fold. Carries fourteen
  modified nucleosides, among them D16, D17, m2,2G26, Cm32, Gm34, wybutosine at 37,
  m5C40, m7G46, m5C49, T54, psi55 and m1A58; each is written as its parent base in
  nucleotide_sequence.
